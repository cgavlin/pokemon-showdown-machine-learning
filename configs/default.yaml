# Default experiment configuration.
# When changing the reward function, environment rules,
# observation space, or action space, create a distinct experiment
# version. Copy this file (e.g. configs/exp_002_stage2.yaml) rather
# than editing in place once a run has been used for real results.

experiment_name: "stage1_basic_mechanics_baseline"
curriculum_stage: "stage1_basic_mechanics"
environment_version: "0.2.0"

battle_format: "gen9randombattle"
local_showdown_server: "ws://localhost:8000/showdown/websocket"

team_pool_dir: null       # for non-random-battle formats (e.g. gen9ou),
                           # point this at a directory of Showdown-export
                           # team .txt files (see environment/team_pool.py
                           # and configs/teams/stage3_ou/ for examples) so
                           # every battle draws a random team from the pool
                           # instead of poke-env's random-battle generation,
                           # which doesn't apply outside random-battle
                           # formats. Leave null for gen9randombattle.
team_pool_pattern: "*.txt"

knowledge_base_path: "runs/pokemon_knowledge.json"
                           # See knowledge/pokemon_knowledge.py. Shared
                           # across every run pointed at this same path,
                           # so it keeps growing run over run instead of
                           # starting empty each time. Set to null to
                           # disable the feature entirely (the relevant
                           # part of the observation is then always
                           # zero-filled instead of learned).

reward:
  effective_move: 0.15
  super_effective_move: 0.3
  extremely_effective_move: 0.45
  ineffective_move: -0.15
  disadvantageous_move: -0.3
  favorable_switch: 0.2
  positional_advantage: 0.1
  avoidable_damage_taken: -0.1
  faint_opponent_pokemon: 1.0
  lose_own_pokemon_unnecessarily: -1.0
  win_reward: 15.0
  loss_penalty: -15.0
  draw_reward: -1.0

training:
  total_steps: 200000
  batch_size: 256
  replay_capacity: 100000
  learning_starts: 5000
  train_every: 4
  target_update_every: 1000
  gamma: 0.99
  learning_rate: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000
  eval_every_steps: 10000
  eval_battles: 200
  seed: 0
  device: "cpu"

self_play:
  enabled: true          # set true to make scripts/train.py train via
                           # self-play instead of a fixed scripted opponent
                           # (see training/trainer_factory.py for the exact
                           # dispatch rules). scripts/self_play_train.py and
                           # scripts/pooled_self_play_train.py also exist as
                           # direct, config-independent entry points.
  mode: "pooled"           # "pooled" (train against a rotating pool of the
                           # learner's own past checkpoints
  pool_dir: null           # null (default): pool lives inside this run's own
                           # directory, isolated per run. Set an explicit path
                           # (e.g. "runs/self_play_pool") to share/persist a
                           # pool across multiple separate training runs.
  max_pool_size: 20
  episodes_per_opponent: 20  # pooled mode only: how many episodes to play
                              # against a sampled opponent before swapping
  bootstrap_opponent: null   # pooled mode only: scripted opponent used while
                              # the pool is still empty. null (default): falls
                              # back to this stage's own opponent_factory
                              # (e.g. "heuristic" for stage4_competitive_play)

live_battles:
  enabled: false           # NEVER set true here; see showdown/integration.py