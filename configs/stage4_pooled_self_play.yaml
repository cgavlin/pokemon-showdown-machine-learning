# Stage 4 (competitive play) experiment configuration: pooled self-play.
# When changing the reward function, environment rules,
# observation space, or action space, create a distinct experiment
# version. Copy this file rather than editing in place once a run has
# been used for real results.
#
# Usage:
#   python scripts/train.py --config configs/stage4_pooled_self_play.yaml
#
# Differs from configs/default.yaml only in curriculum_stage (stage4
# instead of stage1) and self_play.enabled (true instead of false).
# Everything else -- reward shaping, training hyperparameters -- is
# unchanged from the Stage 1 baseline; tune these once you have actual
# Stage 1-3 results to compare against.

experiment_name: "stage4_competitive_play_pooled_self_play"
curriculum_stage: "stage4_competitive_play"
environment_version: "0.2.0"

battle_format: "gen9ou"
local_showdown_server: "ws://localhost:8000/showdown/websocket"

team_pool_dir: "configs/teams/stage3_ou"  # gen9ou needs an explicit team
                                            # pool -- see environment/team_pool.py.
                                            # These two example teams are
                                            # illustrative starting points;
                                            # verify/replace them for real use.
team_pool_pattern: "*.txt"

knowledge_base_path: "runs/pokemon_knowledge.json"
                           # Shared with configs/default.yaml's path on
                           # purpose: species knowledge learned during
                           # earlier stages is just as useful here.

reward:
  effective_move: 0.15
  super_effective_move: 0.3
  extremely_effective_move: 0.45
  ineffective_move: -0.15
  disadvantageous_move: -0.3
  favorable_switch: 0.2
  positional_advantage: 0.1
  avoidable_damage_taken: -0.1
  faint_opponent_pokemon: 1.0
  lose_own_pokemon_unnecessarily: -1.0
  win_reward: 15.0
  loss_penalty: -15.0
  draw_reward: -1.0

training:
  total_steps: 200000
  batch_size: 256
  replay_capacity: 100000
  learning_starts: 5000
  train_every: 4
  target_update_every: 1000
  gamma: 0.99
  learning_rate: 0.0003
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 100000
  eval_every_steps: 10000
  eval_battles: 200
  seed: 0
  device: "cpu"

self_play:
  enabled: true            # the only meaningful difference from default.yaml
  mode: "pooled"
  pool_dir: "runs/stage4_self_play_pool"  # persists/shares across separate
                                            # runs of this config, instead of
                                            # each run starting an empty pool
  max_pool_size: 20
  episodes_per_opponent: 20
  bootstrap_opponent: null  # falls back to this stage's own opponent_factory
                             # ("heuristic") until the pool has entries

live_battles:
  enabled: false            # NEVER set true here; see showdown/integration.py